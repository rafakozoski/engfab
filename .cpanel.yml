---
# Deploy do cPanel (HomeHost). Copia os arquivos do repositório para a raiz do site.
# Só copia e sobrescreve: nunca apaga arquivo que já está no servidor (a pasta sitepro/ do site antigo fica intacta).
# O .htaccess deste repositório substitui o do Construtor Fácil (backup em agencia/clientes/engfab/backup-site-antigo/).
deployment:
  tasks:
    - export DEPLOYPATH=/home/engfabc/public_html/
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
